<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>T Chaos</title>
    <style>
      body { margin: 0; width: 320px; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: #0d0e12; color: #f3f4f6; }
      header { padding: 12px 14px 8px; display: flex; justify-content: space-between; align-items: baseline; }
      h1 { font-size: 16px; margin: 0; } h1 i { font-style: normal; color: #c6ff3d; }
      .muted { color: #b4b8c4; font-size: 12px; }
      ul { list-style: none; margin: 0; padding: 0 10px 10px; }
      li { background: #16171d; border: 1px solid #2b2e38; border-radius: 12px; padding: 8px 10px; margin-bottom: 6px; }
      .row { display: flex; align-items: center; gap: 8px; }
      .pill { min-width: 24px; padding: 1px 6px; border-radius: 5px; color: #fff; font-weight: 800; font-size: 12px; text-align: center; }
      .grow { flex: 1; }
      .score { font-weight: 800; font-size: 16px; }
      .bar { height: 5px; border-radius: 3px; background: #2b2e38; margin-top: 6px; overflow: hidden; } .bar i { display: block; height: 100%; }
      .alert { font-size: 12px; margin-top: 4px; }
      .opts { padding: 10px 14px 14px; border-top: 1px solid #2b2e38; }
      input { width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 8px; border: 1px solid #2b2e38; background: #000; color: #fff; }
      button, a.btn { margin-top: 8px; padding: 8px 12px; border-radius: 10px; border: 0; background: #c6ff3d; color: #10130a; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block; }
    </style>
  </head>
  <body>
    <header><h1>Line <i>Collector</i> · T Chaos</h1><span class="muted" id="updated"></span></header>
    <ul id="lines"><li class="muted">Loading…</li></ul>
    <div class="opts">
      <a class="btn" id="open" target="_blank">Open the app</a>
      <details id="options">
        <summary class="muted">Server</summary>
        <input id="api" placeholder="https://your-domain" />
        <button id="save">Save</button>
      </details>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
